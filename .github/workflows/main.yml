name: Gera a cobrinha das contribuicoes

# A imagem sai numa branch separada (output) e o README a consome de la, entao
# o historico da main nao engorda com um SVG reescrito a cada doze horas.
on:
  schedule:
    - cron: "0 */12 * * *"
  # Para conferir na hora, sem esperar o proximo horario.
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  gerar:
    runs-on: ubuntu-latest
    # Sem isto o passo de publicar nao consegue escrever na branch output: o
    # token do Actions nasce somente-leitura desde 2023.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: cobrinha
        with:
          github_user_name: ${{ github.repository_owner }}
          # Duas versoes: o GitHub troca a imagem conforme o tema de quem olha,
          # e a clara some no escuro.
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
